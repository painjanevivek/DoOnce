name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:extension
      - run: npm run verify:controlled-runs
      - run: npm run build
      - run: docker build --tag doonce-frontend:ci .
      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > doonce-frontend.sbom.json
      - name: Scan production container
        uses: anchore/scan-action@v7
        with:
          image: doonce-frontend:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - uses: actions/upload-artifact@v6
        with:
          name: doonce-frontend-sbom
          path: doonce-frontend.sbom.json
          retention-days: 30
